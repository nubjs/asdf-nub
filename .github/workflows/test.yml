name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x -P SCRIPTDIR -S warning bin/* lib/*.bash

  plugin-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: asdf plugin test
        uses: asdf-vm/actions/plugin-test@v3
        with:
          command: nub --version
          # asdf's default branch is now the Go rewrite, which ships no runnable
          # bin/asdf for the action to clone-and-invoke. Pin the last Bash release;
          # the plugin's bin/ hook contract is unchanged across the rewrite.
          asdf_branch: v0.15.0
